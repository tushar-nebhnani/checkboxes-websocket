<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0714;
        --panel: rgba(30, 22, 45, 0.84);
        --panel-border: rgba(216, 180, 254, 0.2);
        --text: #f8fafc;
        --muted: #c4b5fd;
        --accent: #a855f7;
        --accent-strong: #7c3aed;
        --ring: rgba(168, 85, 247, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(168, 85, 247, 0.28),
            transparent 32rem
          ),
          radial-gradient(
            circle at bottom right,
            rgba(99, 102, 241, 0.18),
            transparent 30rem
          ),
          linear-gradient(135deg, #0c0714 0%, #1e1433 48%, #09090b 100%);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.035) 1px,
            transparent 1px
          );
        background-size: 42px 42px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 82%);
        -webkit-mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      h1 {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 18px;
        font-size: clamp(2.4rem, 6vw, 5rem);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.95;
        text-wrap: balance;
      }

      h1::after {
        display: block;
        max-width: 620px;
        margin-top: 18px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-weight: 450;
        line-height: 1.7;
        content: "A tiny field of synchronized choices. Toggle, scan, repeat.";
      }

      #container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
        gap: 12px;
        width: min(1120px, calc(100% - 32px));
        margin: 22px auto 64px;
        padding: 22px;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
      }

      input[type="checkbox"] {
        width: 28px;
        height: 28px;
        margin: 0;
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 6px;
        appearance: none;
        background:
          linear-gradient(
            180deg,
            rgba(216, 180, 254, 0.12),
            rgba(255, 255, 255, 0.02)
          ),
          #1b1229;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          transform 140ms ease;
      }

      input[type="checkbox"]:hover {
        border-color: rgba(168, 85, 247, 0.82);
        box-shadow:
          0 0 0 4px rgba(168, 85, 247, 0.13),
          inset 0 1px 2px rgba(0, 0, 0, 0.35);
        transform: translateY(-1px);
      }

      input[type="checkbox"]:checked {
        border-color: var(--accent);
        background:
          url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 14 14' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 7.2L5.6 9.8L11 4.2' stroke='%232e1065' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")
            center / 17px 17px no-repeat,
          linear-gradient(135deg, var(--accent), var(--accent-strong));
        box-shadow:
          0 0 0 3px var(--ring),
          0 8px 18px rgba(168, 85, 247, 0.28);
      }

      input[type="checkbox"]:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 3px;
      }

      @media (max-width: 640px) {
        h1 {
          width: min(100% - 24px, 1120px);
          padding-top: 36px;
        }

        #container {
          grid-template-columns: repeat(auto-fill, minmax(24px, 1fr));
          gap: 10px;
          width: min(100% - 24px, 1120px);
          padding: 14px;
        }

        input[type="checkbox"] {
          width: 24px;
          height: 24px;
          border-radius: 5px;
        }
      }
    </style>
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <h1>Checkboxes</h1>
    <div id="container"></div>
    <script>
      const socket = io();
      const container = document.getElementById("container");
      const CHECKBOX_COUNT = 1008;

      socket.on("server:checkbox:change", (data) => {
        console.log("Socket server event", data);
        const { idx, checked } = data;

        const input = document.getElementById(`checkbox-${idx}`);
        if (input) {
          input.checked = checked;
        }
      });

      new Array(CHECKBOX_COUNT).fill(null).forEach((_, idx) => {
        const input = document.createElement("input");
        input.type = "checkbox";
        input.id = `checkbox-${idx}`;

        input.addEventListener("change", (event) => {
          const checked = event.target.checked;
          console.log("Checkbox changed", { idx, checked });
          socket.emit("client:checkbox:change", { idx, checked });
        });
        container.appendChild(input);
      });
    </script>
  </body>
</html>
